<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Helado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background:#1a3a2a;">
    <span class="navbar-brand fw-semibold">Helados Fulsta</span>
    <div class="d-flex gap-3">
        <a class="nav-link text-white-50" th:href="@{/clientes/listar}">Clientes</a>
        <a class="nav-link text-white active" th:href="@{/helados/listar}">Helados</a>
        <a class="nav-link text-white-50" th:href="@{/ventas/listar}">Ventas</a>
    </div>
</nav>

<div class="container py-4" style="max-width: 540px;">
    <h5 class="mb-4">Editar helado</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/helados/actualizar/{id}(id=${objHelado.codHelado})}"
          th:object="${objHelado}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select th:field="*{estado}" class="form-select">
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>
        </div>
        <div class="d-flex gap-2 justify-content-end">
            <a th:href="@{/helados/listar}" class="btn btn-secondary btn-sm">Cancelar</a>
            <button type="submit" class="btn btn-sm text-white" style="background:#1a3a2a;">Actualizar</button>
        </div>
    </form>
</div>
</body>
</html>
