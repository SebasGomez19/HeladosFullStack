<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background:#1a3a2a;">
    <span class="navbar-brand fw-semibold">Helados Fulsta</span>
    <div class="d-flex gap-3">
        <a class="nav-link text-white-50" th:href="@{/clientes/listar}">Clientes</a>
        <a class="nav-link text-white-50" th:href="@{/helados/listar}">Helados</a>
        <a class="nav-link text-white active" th:href="@{/ventas/listar}">Ventas</a>
    </div>
</nav>

<div class="container-fluid px-4 py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Ventas</h5>
        <a th:href="@{/ventas/crear}" class="btn btn-sm text-white" style="background:#1a3a2a;">
            + Nueva venta
        </a>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Cliente</th>
            <th>Helado</th>
            <th>Tipo</th>
            <th>Bolas</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venta : ${ventas}">
            <td th:text="${venta.codVenta}"></td>
            <td th:text="${venta.cliente.nombres}"></td>
            <td th:text="${venta.helado.nombre}"></td>
            <td th:text="${venta.tipoHelado}"></td>
            <td th:text="${venta.cantidadBolas}"></td>
            <td>
                <a th:href="@{/ventas/actualizar/{id}(id=${venta.codVenta})}"
                   class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/ventas/eliminar/{id}(id=${venta.codVenta})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar esta venta?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(ventas)}">
            <td colspan="6" class="text-center text-muted">No hay ventas registradas.</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/ventas/listar(page=${currentPage - 1})}">‹</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/ventas/listar(page=${i})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/ventas/listar(page=${currentPage + 1})}">›</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
