<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<nav class="navbar navbar-dark px-4" style="background:#1a3a2a;">
    <span class="navbar-brand fw-semibold">Helados Fulsta</span>
    <div class="d-flex gap-3">
        <a class="nav-link text-white-50" th:href="@{/clientes/listar}">Clientes</a>
        <a class="nav-link text-white-50" th:href="@{/helados/listar}">Helados</a>
        <a class="nav-link text-white active" th:href="@{/ventas/listar}">Ventas</a>
    </div>
</nav>

<div class="container py-4" style="max-width: 540px;">
    <h5 class="mb-4">Nueva venta</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/ventas/crear}" th:object="${objVenta}" method="post">
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select th:field="*{cliente}" class="form-select" required>
                <option value="">-- Seleccionar cliente --</option>
                <option th:each="c : ${arrClientes}"
                        th:value="${c.codCliente}"
                        th:text="${c.nombres}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Helado</label>
            <select th:field="*{helado}" class="form-select" required>
                <option value="">-- Seleccionar helado --</option>
                <option th:each="h : ${arrHelados}"
                        th:value="${h.codHelado}"
                        th:text="${h.nombre}"></option>
            </select>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Tipo de helado</label>
                <select th:field="*{tipoHelado}" class="form-select">
                    <option value="1">Cono</option>
                    <option value="2">Copa</option>
                    <option value="3">Vasito</option>
                </select>
            </div>
            <div class="col mb-3">
                <label class="form-label">Cantidad de bolas</label>
                <input type="number" th:field="*{cantidadBolas}"
                       class="form-control" min="1" max="10" required/>
            </div>
        </div>
        <div class="d-flex gap-2 justify-content-end">
            <a th:href="@{/ventas/listar}" class="btn btn-secondary btn-sm">Cancelar</a>
            <button type="submit" class="btn btn-sm text-white" style="background:#1a3a2a;">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
